name: flyrank-capstone-image-relevance
title: AI Image Understanding & Content Matching Engine
track: Backend AI Engineering Track (Week 8 Capstone)
version: "1.0.0"

run: uvicorn main:app --host 0.0.0.0 --port 8000
seed: python seed_data.py
test: pytest test_capstone.py -v
base_url: http://localhost:8000

endpoints:
  - path: /batch/process-images
    method: POST
    description: Trigger background vision processing & embedding generation job
  - path: /posts/{id}/images
    method: GET
    description: Retrieve ranked image suggestions with Mismatch Guard evaluation
  - path: /suggestions/{id}/approve
    method: POST
    description: Human-in-the-loop approval workflow
  - path: /suggestions/{id}/reject
    method: POST
    description: Human-in-the-loop rejection workflow
  - path: /stats/costs
    method: GET
    description: AI processing cost tracking summary
  - path: /eval
    method: GET
    description: Evaluation dataset Top-1 precision calculation
